<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A resale certificate: a document with a seal and ribbon.
       64 x 64 and the portal's own three colours - #FBDBD0 for the shadow
       sheet, white for the page, #C1DBF6 for the fill, #374874 for the line -
       so it sits beside Odoo's My Account icons rather than next to them. -->

  <!-- The sheet behind, offset like the other icons' shadow layer. -->
  <path d="M15.5 6.5h25.2L52 17.8v34.4a3.3 3.3 0 0 1-3.3 3.3H15.5a3.3 3.3 0 0 1-3.3-3.3V9.8a3.3 3.3 0 0 1 3.3-3.3Z" fill="#FBDBD0"/>

  <!-- The page itself. -->
  <path d="M19.4 2.6h22.1L52 13.1v34.4a3.3 3.3 0 0 1-3.3 3.3H19.4a3.3 3.3 0 0 1-3.3-3.3V5.9a3.3 3.3 0 0 1 3.3-3.3Z" fill="white" stroke="#374874" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- The folded corner. -->
  <path d="M41.5 2.6V9.8a3.3 3.3 0 0 0 3.3 3.3H52" stroke="#374874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lines of text: what a certificate is mostly made of. -->
  <path d="M22.7 20.8h13.1M22.7 27.3h19.6M22.7 33.8h9.8" stroke="#374874" stroke-width="2.2" stroke-linecap="round"/>

  <!-- The seal, which is the thing that makes it a certificate. -->
  <circle cx="43.5" cy="42.5" r="9.2" fill="#C1DBF6" stroke="#374874" stroke-width="2.2"/>
  <path d="M39.6 42.7l2.8 2.8 5.2-5.5" stroke="#374874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Its ribbon. -->
  <path d="M38.6 50.2l-2.1 10.4 7-3.8 7 3.8-2.1-10.4" fill="#C1DBF6" stroke="#374874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
