<style>
/* The Series 1200 preview. Everything is scoped under .aadp and sets its own
 * box-sizing, font and colours, because this has to survive being dropped
 * into a WordPress theme that knows nothing about it. */

.aadp {
  position: relative;
  width: 100%;
  height: clamp(400px, 64vh, 640px);
  overflow: hidden;
  border-radius: 3px;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0) 60%),
    linear-gradient(176deg, #495158 0%, #2a3036 46%, #101316 100%);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: #eef1f3;
  -webkit-font-smoothing: antialiased;
}

.aadp *,
.aadp *::before,
.aadp *::after { box-sizing: border-box; }

.aadp--expanded {
  position: fixed;
  inset: 0;
  z-index: 99999;
  height: auto;
  border-radius: 0;
}

.aadp__canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}

.aadp__canvas.aadp--dragging { cursor: grabbing; }

.aadp__readout {
  position: absolute;
  top: 14px;
  left: 16px;
  right: 190px;
  margin: 0;
  font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.07em;
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.62);
  text-transform: uppercase;
  pointer-events: none;
}

.aadp__tools {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
}

.aadp__tool {
  font-family: "Archivo Narrow", "Archivo", system-ui, sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #eef1f3;
  background: rgba(14, 17, 20, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.14);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-radius: 2px;
  height: 34px;
  padding: 0 12px;
  margin: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  text-shadow: none;
  box-shadow: none;
}

.aadp__tool:hover { background: rgba(14, 17, 20, 0.8); }
.aadp__tool--icon { width: 34px; padding: 0; }
.aadp__tool svg { width: 15px; height: 15px; display: block; }

.aadp__panel {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px 14px;
  background: rgba(14, 17, 20, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.14);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-radius: 3px;
}

.aadp__groups {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 30px;
  flex: 1 1 auto;
  min-width: 0;
}

/* The arrow that folds them away. It is the one control that must stay
 * reachable when everything else is hidden, so it is the panel's own child
 * rather than an overlay on top of it. */
.aadp__fold {
  flex: none;
  width: 32px;
  height: 32px;
  padding: 0;
  margin: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 2px;
  color: #eef1f3;
  cursor: pointer;
  box-shadow: none;
}

.aadp__fold:hover { background: rgba(255, 255, 255, 0.15); }

.aadp__fold svg {
  width: 16px;
  height: 16px;
  display: block;
  transition: transform 170ms ease;
}

/* Folded: the panel is just the arrow, down in the corner, and the door has
 * the whole frame. */
.aadp--folded .aadp__panel {
  right: auto;
  padding: 7px;
}

.aadp--folded .aadp__groups { display: none; }
.aadp--folded .aadp__fold svg { transform: rotate(180deg); }

.aadp__group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.aadp__group-label {
  font-family: "Archivo Narrow", "Archivo", system-ui, sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #a8b2b9;
}

.aadp__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.aadp__chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 11px 0 9px;
  margin: 0;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.05);
  color: #eef1f3;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  text-transform: none;
  text-shadow: none;
  box-shadow: none;
  transition: border-color 140ms ease, background 140ms ease;
}

.aadp__chip:hover { background: rgba(255, 255, 255, 0.12); }

.aadp__chip[aria-checked="true"] {
  border-color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.16);
}

.aadp__dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
  flex: none;
}

.aadp__loading,
.aadp--failed .aadp__message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  background: rgba(16, 19, 22, 0.55);
}

.aadp__loading-text,
.aadp__message {
  margin: 0;
  max-width: 90%;
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.72);
  text-transform: uppercase;
  /* These now carry a URL, which has no spaces to wrap at. */
  overflow-wrap: anywhere;
  word-break: break-word;
}

.aadp__loading[hidden] { display: none; }

.aadp :focus-visible {
  outline: 2px solid #c48c48;
  outline-offset: 2px;
}

@media (max-width: 560px) {
  .aadp { height: clamp(360px, 58vh, 520px); }
  .aadp__panel { gap: 11px 18px; padding: 11px 12px 12px; }
  .aadp__chip { height: 28px; font-size: 12.5px; padding: 0 9px 0 8px; }
  .aadp__readout { font-size: 10px; right: 148px; }
  .aadp__tool { font-size: 11px; padding: 0 9px; }
}

@media (prefers-reduced-motion: reduce) {
  .aadp__chip,
  .aadp__fold svg { transition: none; }
}
</style>

<div data-aa-door-preview
     data-model="./White_Clear.glb"
     data-wood="./woodgrain.jpg"
     data-three="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"
     data-gltf-loader="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/GLTFLoader.js"></div>

<script>
/* THE SERIES 1200 PREVIEW: ONE MODEL, THE COLOURS SWAPPED IN THE BROWSER.
 *
 * What the site did before this (read off his media account on 2026-10-26,
 * since cancelled): one .glb PER COMBINATION of frame finish and glass colour.
 * Twenty files, ~8.8 MB each for the painted ones and ~10.0 MB for the
 * woodgrain ones, about 180 MB in all, and clicking a colour downloads a
 * whole new door.
 *
 * It does not need to. Every one of those files holds the SAME single mesh -
 * seven primitives, same byte count to within a few dozen bytes - and differs
 * only in what its materials are set to. The materials are named by role,
 * which is what makes this possible:
 *
 *     Silver            the hardware and track          left alone
 *     Frame_white       the door's frame                 recoloured
 *     Frane_Black       ditto, in the Black files        (his typo, matched)
 *     Frame_woodgrain   ditto, with a texture
 *     Frame_bronze      a piece that is DARK in every
 *                       one of his files                 left alone
 *     Glass_clear ...   the glazing                      recoloured
 *     Blue_Circle       the rollers, inner part          black unless White
 *     White_Circle      the rollers, the wheels          black unless White
 *
 * So: load one file, keep it, and set colours on the materials. One 8.8 MB
 * download instead of twenty, and every colour change instant.
 *
 * The numbers below are not invented. Every base colour, metalness,
 * roughness and transmission factor was read out of the glTF material
 * definitions in his own files, and baseColorFactor in glTF is LINEAR, which
 * is why they go in through Color.fromArray and not through a hex string.
 */

(function (global) {
  "use strict";

  /* RESOLVED WHEN THE LIBRARIES ARE IN, NOT WHEN THIS FILE IS PARSED.
   *
   * The site is Elementor, and an Elementor HTML widget has its markup
   * injected into the page after loading rather than parsed with it. A
   * <script src> that arrives that way is NOT run by the browser - setting
   * innerHTML never executes external scripts - so three.js can easily turn
   * up after this file, or not at all. A THREE captured here at parse time
   * would then stay undefined for ever, which is precisely the "could not
   * load its renderer" the owner saw on 2026-10-26.
   *
   * So the libraries are not left to script tags at all: this file loads
   * them itself, in order, and mounts when they are in. Appending a script
   * element does execute it, whoever injected the markup and whenever. */
  var THREE = null;

  var LIB = {
    three: "https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js",
    loader: "https://cdn.jsdelivr.net/npm/three@0.137.5/" +
            "examples/js/loaders/GLTFLoader.js"
  };

  /* Which materials are the door's frame, and which are left as they came.
   * Frame_bronze is dark (0.02 linear, near black) in ALL of his files,
   * including the white and the woodgrain ones, so it is a trim piece and not
   * the frame - painting it would change a door he has already approved. */
  var FRAME_RE = /^fra[mn]e_(white|black|woodgrain)$/i;
  var GLASS_RE = /^glass/i;

  /* THE ROLLERS - the wheels down each side of the door that run in the
   * track. Named Blue_Circle and White_Circle in his files, which is why
   * they went unidentified for a day; the owner named them on 2026-10-27.
   *
   * Two materials, one part: measured off the mesh, both sit on the back
   * face, at both side edges, running up the height of the door - which is
   * where rollers are and nothing else is. So both take the colour. */
  var ROLLER_RE = /circle/i;

  /* Not pure black. These are not metal, and a 0,0,0 non-metal under a soft
   * studio light is a silhouette with no shape in it - the wheel reads as a
   * hole. Nearly black still catches the highlight that makes it round. */
  var BLACK_ROLLER = [0.02, 0.02, 0.02];

  var FRAMES = [
    { id: "white",  name: "White",  swatch: "#f1f1ef",
      linear: [1, 1, 1],                        metalness: 0.282, roughness: 0.550 },
    { id: "bronze", name: "Bronze", swatch: "#2c2a28",
      linear: [0.0204, 0.0201, 0.0195],         metalness: 0.179, roughness: 0.450 },
    { id: "black",  name: "Black",  swatch: "#111214",
      linear: [0, 0, 0],                        metalness: 0.282, roughness: 0.095 },
    /* The linear value is the AVERAGE of the woodgrain texture, used on its
     * own if that image cannot be fetched - so a wrong texture path leaves a
     * brown door rather than a white one that silently looks like the White
     * finish. Cleared to white once the image is in, because glTF multiplies
     * the map by the base colour. */
    { id: "wood",   name: "Wood",   swatch: "#b65c14",
      texture: true, linear: [0.566, 0.111, 0.004],
      metalness: 0.282, roughness: 0.418 }
  ];

  var GLASSES = [
    { id: "clear",  name: "Clear",  swatch: "#e6e6e6",
      linear: [0.8, 0.8, 0.8],                  transmission: 1.000, roughness: 0.001 },
    { id: "white",  name: "White",  swatch: "#dde6dc",
      linear: [0.7323, 0.8001, 0.7270],         transmission: 0.578, roughness: 0.063 },
    { id: "green",  name: "Green",  swatch: "#78c792",
      linear: [0.1946, 0.5841, 0.3005],         transmission: 0.578, roughness: 0.063 },
    { id: "bronze", name: "Bronze", swatch: "#a45633",
      linear: [0.3771, 0.0895, 0.0278],         transmission: 0.578, roughness: 0.063 },
    { id: "grey",   name: "Grey",   swatch: "#a4a4a4",
      linear: [0.3771, 0.3771, 0.3771],         transmission: 0.578, roughness: 0.063 }
  ];

  /* Only reached if the element carries no data-model. It names his own
   * server, not the media account that hosted these files until 2026-10-26 -
   * a fallback pointing at a cancelled subscription is a page that breaks
   * later, quietly, for whoever forgets the attribute. */
  var DEFAULT_MODEL = "./White_Clear.glb";
  var DEFAULT_WOOD = "./woodgrain.jpg";

  /* ---- a studio environment, generated rather than downloaded --------- */

  function studioEnv() {
    function face(stops) {
      var c = document.createElement("canvas");
      c.width = c.height = 128;
      var g = c.getContext("2d");
      var grad = g.createLinearGradient(0, 0, 0, 128);
      for (var i = 0; i < stops.length; i++) {
        grad.addColorStop(stops[i][0], stops[i][1]);
      }
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      return c;
    }
    var side = face([[0, "#b3bec7"], [0.46, "#737d86"], [0.54, "#2b3035"], [1, "#14171a"]]);
    var up = face([[0, "#eaf0f4"], [1, "#c3ccd4"]]);
    var down = face([[0, "#1c2023"], [1, "#0d1012"]]);
    var tex = new THREE.CubeTexture([side, side, up, down, side, side]);
    tex.encoding = THREE.sRGBEncoding;
    tex.needsUpdate = true;
    return tex;
  }

  /* ---- DOM ------------------------------------------------------------ */

  function el(tag, cls, parent) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (parent) { parent.appendChild(node); }
    return node;
  }

  var CHEVRON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"' +
    ' aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';

  var EXPAND_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
    ' stroke-linecap="square" aria-hidden="true">' +
    '<path d="M9 4H4v5M20 9V4h-5M15 20h5v-5M4 15v5h5"></path>' +
    '<path d="M4 4l6 6M20 4l-6 6M20 20l-6-6M4 20l6-6"></path></svg>';

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ---- the viewer ----------------------------------------------------- */

  function mount(host, options) {
    options = options || {};

    var modelUrl = options.model || host.getAttribute("data-model") || DEFAULT_MODEL;
    var woodUrl = options.wood || host.getAttribute("data-wood") || DEFAULT_WOOD;

    /* THE SAME BLOCK GOES ON ALL THREE SERIES PAGES (owner, 2026-10-26: "all
     * 3 doors use the same model so we can use the same thing for all
     * three"), and the same model URL across the three means a visitor
     * downloads it once and the browser caches it for the other two.
     *
     * Should a series not offer the full range, data-frames and data-glasses
     * narrow the choices for that page alone - data-frames="white,black" -
     * with no change to this file. An unrecognised or empty list offers
     * everything rather than nothing. */
    function narrow(attr, all) {
      var raw = String(options[attr] || host.getAttribute("data-" + attr) || "");
      if (!raw.trim()) { return all; }
      var wanted = raw.toLowerCase().split(/[\s,]+/);
      var kept = all.filter(function (choice) {
        return wanted.indexOf(choice.id) !== -1;
      });
      return kept.length ? kept : all;
    }

    var frames = narrow("frames", FRAMES);
    var glasses = narrow("glasses", GLASSES);

    THREE = THREE || global.THREE;

    if (!THREE || !THREE.GLTFLoader) {
      fail(host, THREE ? LIB.loader : LIB.three);
      return null;
    }

    host.classList.add("aadp");

    var canvas = el("canvas", "aadp__canvas", host);
    var readout = el("p", "aadp__readout", host);
    var tools = el("div", "aadp__tools", host);

    var resetBtn = el("button", "aadp__tool", tools);
    resetBtn.type = "button";
    resetBtn.textContent = "Reset view";

    var expandBtn = el("button", "aadp__tool aadp__tool--icon", tools);
    expandBtn.type = "button";
    expandBtn.innerHTML = EXPAND_ICON;
    expandBtn.setAttribute("aria-label", "Fullscreen");

    /* THE CHOICES FOLD AWAY (owner, 2026-10-26: "on mobile the choices block
     * the visibility of the door so being able to hide them to see the door
     * fully would be better"). Folded, the panel shrinks to the arrow alone
     * and the door has the whole frame; what is currently selected is still
     * named along the top, so nothing is lost by hiding them. */
    var panel = el("div", "aadp__panel", host);
    var groups = el("div", "aadp__groups", panel);

    var fold = el("button", "aadp__fold", panel);
    fold.type = "button";
    fold.innerHTML = CHEVRON;
    fold.id = "aadp-fold";
    fold.setAttribute("aria-expanded", "true");
    fold.setAttribute("aria-label", "Hide the colour choices");
    fold.addEventListener("click", function () {
      var folded = host.classList.toggle("aadp--folded");
      fold.setAttribute("aria-expanded", folded ? "false" : "true");
      fold.setAttribute("aria-label",
        folded ? "Show the colour choices" : "Hide the colour choices");
    });
    var loader = el("div", "aadp__loading", host);
    var loaderText = el("p", "aadp__loading-text", loader);
    loaderText.textContent = "Loading the door…";

    /* ---- renderer --------------------------------------------------- */

    var renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias: true, alpha: true
    });
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(32, 1.6, 0.01, 2000);
    var env = studioEnv();
    scene.environment = env;

    scene.add(new THREE.HemisphereLight(0xccd6de, 0x2b3034, 0.6));

    var key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0008;
    key.shadow.radius = 3;
    scene.add(key);

    var fill = new THREE.DirectionalLight(0xdce6ee, 0.5);
    scene.add(fill);

    var rim = new THREE.DirectionalLight(0xffffff, 0.35);
    scene.add(rim);

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.42 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    floor.visible = false;
    scene.add(floor);

    /* ---- state ------------------------------------------------------ */

    var frameMats = [];
    var glassMats = [];
    var rollerMats = [];
    var woodTexture = null;
    var frame = frames[0];
    var glass = glasses[0];

    var HOME = { azimuth: -0.38, polar: 1.44, zoom: 1 };
    var want = { azimuth: HOME.azimuth, polar: HOME.polar, zoom: HOME.zoom };
    var have = { azimuth: HOME.azimuth, polar: HOME.polar, zoom: HOME.zoom };
    var target = new THREE.Vector3();
    var span = new THREE.Vector3(1, 1, 1);
    var baseDistance = 10;

    /* ---- applying a choice ------------------------------------------ */

    function applyFrame(choice) {
      frame = choice;

      if (choice.texture && !woodTexture) {
        woodTexture = new THREE.TextureLoader().load(woodUrl, function () {
          /* Arrived: stop tinting underneath it. */
          frameMats.forEach(function (m) {
            if (m.map === woodTexture) {
              m.color.setRGB(1, 1, 1);
              m.needsUpdate = true;
            }
          });
        });
        woodTexture.flipY = false;                   /* glTF UV convention */
        woodTexture.encoding = THREE.sRGBEncoding;
        woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
      }

      var textureIsIn = !!(choice.texture && woodTexture && woodTexture.image);

      frameMats.forEach(function (m) {
        m.map = choice.texture ? woodTexture : null;
        if (textureIsIn) {
          m.color.setRGB(1, 1, 1);
        } else {
          m.color.fromArray(choice.linear);
        }
        m.metalness = choice.metalness;
        m.roughness = choice.roughness;
        m.needsUpdate = true;
      });

      applyRollers(choice);
      label();
    }

    /* THE ROLLERS FOLLOW THE FRAME (owner, 2026-10-27: "all colors except
     * white should have black rollers"). White keeps the rollers his model
     * was built with - restored from what they came in as, rather than
     * guessed at, so this cannot drift from the file. */
    function applyRollers(choice) {
      var white = choice.id === "white";

      rollerMats.forEach(function (m) {
        if (white) {
          m.color.copy(m.userData.aaAsBuilt);
        } else {
          m.color.fromArray(BLACK_ROLLER);
        }
        m.needsUpdate = true;
      });
    }

    function applyGlass(choice) {
      glass = choice;
      glassMats.forEach(function (m) {
        m.color.fromArray(choice.linear);
        m.roughness = choice.roughness;
        if ("transmission" in m) { m.transmission = choice.transmission; }
        m.needsUpdate = true;
      });
      label();
    }

    function label() {
      readout.textContent = frame.name + " frame · " + glass.name + " glass";
    }

    /* ---- chips ------------------------------------------------------ */

    function group(title, choices, initial, onPick) {
      var wrap = el("div", "aadp__group", groups);
      var head = el("span", "aadp__group-label", wrap);
      head.textContent = title;
      var chips = el("div", "aadp__chips", wrap);
      chips.setAttribute("role", "radiogroup");
      chips.setAttribute("aria-label", title);

      var buttons = [];
      choices.forEach(function (choice, index) {
        var b = el("button", "aadp__chip", chips);
        b.type = "button";
        b.id = "aadp-" + title.toLowerCase().replace(/[^a-z]+/g, "-") + "-" + choice.id;
        b.setAttribute("role", "radio");
        b.setAttribute("aria-checked", index === initial ? "true" : "false");
        var dot = el("span", "aadp__dot", b);
        dot.style.background = choice.swatch;
        b.appendChild(document.createTextNode(choice.name));
        b.addEventListener("click", function () {
          buttons.forEach(function (other) {
            other.setAttribute("aria-checked", "false");
          });
          b.setAttribute("aria-checked", "true");
          onPick(choice);
        });
        buttons.push(b);
      });
    }

    group("Frame finish", frames, 0, applyFrame);
    group("Glass", glasses, 0, applyGlass);

    /* ---- the model -------------------------------------------------- */

    new THREE.GLTFLoader().load(modelUrl, function (gltf) {
      var model = gltf.scene;

      model.traverse(function (node) {
        if (!node.isMesh) { return; }
        node.castShadow = true;
        node.receiveShadow = true;
        var mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach(function (m) {
          if (!m) { return; }
          m.envMap = env;
          var name = m.name || "";
          if (GLASS_RE.test(name)) {
            m.envMapIntensity = 1.25;
            m.transparent = true;
            m.side = THREE.DoubleSide;
            if (glassMats.indexOf(m) === -1) { glassMats.push(m); }
          } else if (FRAME_RE.test(name)) {
            m.envMapIntensity = 0.9;
            if (frameMats.indexOf(m) === -1) { frameMats.push(m); }
          } else if (ROLLER_RE.test(name)) {
            m.envMapIntensity = 0.85;

            if (rollerMats.indexOf(m) === -1) {
              /* KEPT BEFORE ANYTHING IS WRITTEN OVER IT. The White finish
               * restores these, and the only honest source for "what the
               * rollers look like" is the file they arrived in. */
              m.userData.aaAsBuilt = m.color.clone();
              rollerMats.push(m);
            }
          } else {
            m.envMapIntensity = 0.85;
          }
        });
      });

      /* CENTRE AND FRAME WHATEVER ARRIVED. The model's units, origin and
       * orientation are whoever exported it's business, so the camera is
       * fitted to the bounding box rather than to numbers typed in here -
       * which is also what lets a replacement model drop straight in. */
      var box = new THREE.Box3().setFromObject(model);
      box.getCenter(target);
      box.getSize(span);
      model.position.y -= box.min.y;      /* stand it on the floor */
      target.y -= box.min.y;
      scene.add(model);

      var reach = Math.max(span.x, span.y, span.z);
      floor.scale.set(reach * 12, reach * 12, 1);
      floor.position.y = 0.0015 * reach;
      floor.visible = true;

      key.position.set(reach * 0.9, reach * 1.5, reach * 1.1);
      key.shadow.camera.left = -reach;
      key.shadow.camera.right = reach;
      key.shadow.camera.top = reach;
      key.shadow.camera.bottom = -reach * 0.6;
      key.shadow.camera.near = reach * 0.05;
      key.shadow.camera.far = reach * 6;
      key.shadow.camera.updateProjectionMatrix();
      fill.position.set(-reach * 1.1, reach * 0.7, reach * 0.7);
      rim.position.set(-reach * 0.3, reach * 0.5, -reach * 1.2);

      camera.near = reach / 500;
      camera.far = reach * 60;

      /* Look a little above the middle, so the control panel along the
       * bottom of the frame does not sit over the door. */
      target.y += span.y * 0.06;

      applyFrame(frames[0]);
      applyGlass(glasses[0]);
      resize();
      loader.hidden = true;

    }, function (progress) {
      if (progress && progress.total) {
        var pct = Math.round(progress.loaded / progress.total * 100);
        loaderText.textContent = "Loading the door… " + pct + "%";
      } else if (progress && progress.loaded) {
        loaderText.textContent = "Loading the door… " +
          (progress.loaded / 1048576).toFixed(1) + " MB";
      }
    }, function (err) {
      /* NAME THE FILE AND SAY WHAT THE SERVER SAID. "That model could not be
       * loaded" sent us looking at the viewer when the answer was that the
       * .glb had never been uploaded (2026-10-26). three's loader reports the
       * status in its message, so a 404 is readable off the page itself. */
      var why = (err && (err.message || err.type)) || "";
      loaderText.textContent = "Could not load " + modelUrl +
        (why ? " — " + why : "");
    });

    /* ---- orbit ------------------------------------------------------ */

    function fit() {
      var vFov = camera.fov * Math.PI / 180;
      var forHeight = (span.y * 1.42 / 2) / Math.tan(vFov / 2);
      var forWidth = (span.x * 1.14 / 2) / (Math.tan(vFov / 2) * camera.aspect);
      baseDistance = Math.max(forHeight, forWidth, span.z * 1.5);
    }

    function place() {
      var d = baseDistance * have.zoom;
      var sp = Math.sin(have.polar);
      camera.position.set(
        target.x + d * sp * Math.sin(have.azimuth),
        target.y + d * Math.cos(have.polar),
        target.z + d * sp * Math.cos(have.azimuth)
      );
      camera.lookAt(target);
    }

    var pointers = {};
    var lastPinch = 0;

    canvas.addEventListener("pointerdown", function (e) {
      canvas.setPointerCapture(e.pointerId);
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      canvas.classList.add("aadp--dragging");
      lastPinch = 0;
    });

    canvas.addEventListener("pointermove", function (e) {
      var prev = pointers[e.pointerId];
      if (!prev) { return; }
      var ids = Object.keys(pointers);

      if (ids.length >= 2) {
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        var a = pointers[ids[0]], b = pointers[ids[1]];
        var gap = Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
        if (lastPinch && gap) { zoomBy(lastPinch / gap); }
        lastPinch = gap;
        return;
      }

      var dx = e.clientX - prev.x;
      var dy = e.clientY - prev.y;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      want.azimuth -= dx * 0.0062;
      want.polar = clamp(want.polar - dy * 0.0052, 0.22, 1.66);
    });

    function release(e) {
      delete pointers[e.pointerId];
      if (!Object.keys(pointers).length) {
        canvas.classList.remove("aadp--dragging");
      }
      lastPinch = 0;
    }

    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);

    canvas.addEventListener("wheel", function (e) {
      e.preventDefault();
      zoomBy(1 + (e.deltaY > 0 ? 0.09 : -0.09));
    }, { passive: false });

    function zoomBy(factor) {
      want.zoom = clamp(want.zoom * factor, 0.40, 2.2);
    }

    resetBtn.addEventListener("click", function () {
      want.azimuth = HOME.azimuth;
      want.polar = HOME.polar;
      want.zoom = HOME.zoom;
    });

    /* ---- fullscreen, with an in-page fallback ----------------------- */

    var expanded = false;

    function setExpanded(on) {
      expanded = on;
      host.classList.toggle("aadp--expanded", on);
      document.body.style.overflow = on ? "hidden" : "";
      expandBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
      resize();
    }

    expandBtn.addEventListener("click", function () {
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      if (expanded) { setExpanded(false); return; }
      if (host.requestFullscreen) {
        var attempt = host.requestFullscreen();
        if (attempt && attempt.catch) {
          attempt.catch(function () { setExpanded(true); });
        }
        return;
      }
      setExpanded(true);
    });

    document.addEventListener("fullscreenchange", function () {
      var on = !!document.fullscreenElement;
      expandBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
      resize();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && expanded) { setExpanded(false); }
    });

    /* ---- loop ------------------------------------------------------- */

    function resize() {
      var w = host.clientWidth || 1;
      var h = host.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      fit();
    }

    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resize).observe(host);
    }
    global.addEventListener("resize", resize);

    resize();
    place();
    label();

    (function tick() {
      have.azimuth += (want.azimuth - have.azimuth) * 0.18;
      have.polar += (want.polar - have.polar) * 0.18;
      have.zoom += (want.zoom - have.zoom) * 0.18;
      place();
      renderer.render(scene, camera);
      global.requestAnimationFrame(tick);
    })();

    return {
      setFrame: function (id) {
        frames.forEach(function (f) { if (f.id === id) { applyFrame(f); } });
      },
      setGlass: function (id) {
        glasses.forEach(function (g) { if (g.id === id) { applyGlass(g); } });
      }
    };
  }

  /* ---- saying so when a library will not come ------------------------- */

  function fail(host, src) {
    host.classList.add("aadp", "aadp--failed");
    var note = el("p", "aadp__message", host);
    note.textContent = "The 3D preview could not load " + src;
  }

  /* ---- fetching the libraries ----------------------------------------- */

  var asked = {};

  function loadScript(src, done, failed) {
    if (asked[src]) {
      asked[src].push({ done: done, failed: failed });
      return;
    }
    asked[src] = [{ done: done, failed: failed }];

    function tell(which, arg) {
      asked[src].forEach(function (waiter) {
        if (waiter[which]) { waiter[which](arg); }
      });
    }

    var tag = document.createElement("script");
    tag.src = src;
    tag.async = false;
    tag.onload = function () { tell("done"); };
    tag.onerror = function () { tell("failed", src); };
    (document.head || document.documentElement).appendChild(tag);
  }

  function withLibraries(done, failed) {
    /* Already on the page - a <script src> in a normally parsed document,
     * which is how the test pages in this module load them. */
    if (global.THREE && global.THREE.GLTFLoader) { done(); return; }
    if (global.THREE) { loadScript(LIB.loader, done, failed); return; }

    loadScript(LIB.three, function () {
      loadScript(LIB.loader, done, failed);
    }, failed);
  }

  /* ---- start ----------------------------------------------------------- */

  function boot() {
    var found = document.querySelectorAll("[data-aa-door-preview]");
    var hosts = [];

    for (var i = 0; i < found.length; i++) {
      /* Elementor re-renders a widget as it is edited, and this file can be
       * run again with the same element still on the page. Mounting twice
       * would stack a second canvas on the first. */
      if (found[i].getAttribute("data-aa-mounted")) { continue; }
      found[i].setAttribute("data-aa-mounted", "1");
      hosts.push(found[i]);
    }

    if (!hosts.length) { return; }

    LIB.three = hosts[0].getAttribute("data-three") || LIB.three;
    LIB.loader = hosts[0].getAttribute("data-gltf-loader") || LIB.loader;

    withLibraries(function () {
      THREE = global.THREE;
      hosts.forEach(function (host) { mount(host, {}); });
    }, function (src) {
      hosts.forEach(function (host) { fail(host, src); });
    });
  }

  global.AADoorPreview = {
    mount: mount,
    boot: boot,
    FRAMES: FRAMES,
    GLASSES: GLASSES
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(window);

/* WHICH BUILD THIS IS. A browser caches a .txt as happily as anything else,
 * and a stale copy of this block looks exactly like a fix that did not work -
 * which cost a round trip on 2026-10-26. The test pages print this, so an old
 * copy announces itself instead of being guessed at. */
if (window.AADoorPreview) { window.AADoorPreview.built = "32a1f7a8"; }
</script>

</body>
</html>
